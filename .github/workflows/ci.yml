name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Advisory only: nearly every finding sits under @expo/cli build
      # tooling rather than shipped runtime code, so a new upstream advisory
      # shouldn't block an unrelated PR. Read the output, don't ignore it.
      - name: Audit production dependencies
        run: pnpm run audit:prod
        continue-on-error: true

name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["artifacts/swing-tempo/server/site/**", "artifacts/swing-tempo/server/build-pages.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: node artifacts/swing-tempo/server/build-pages.mjs _site "${{ steps.pages.outputs.base_path }}" "${{ vars.SUPPORT_EMAIL || 'support@3to1golf.com' }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
